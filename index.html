<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dating App</title>
    <style>
        body { font-family: sans-serif; background: #222; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        #card-box { background: #333; padding: 20px; border-radius: 12px; width: 300px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        #profile-img { width: 100%; height: 350px; object-fit: cover; border-radius: 8px; }
        button { padding: 10px 20px; margin: 10px; cursor: pointer; font-size: 16px; }
    </style>
</head>
<body>
    <div id="card-box">
        <img id="profile-img" src="" alt="Profile">
        <h2 id="profile-name"></h2>
        <p id="profile-bio"></p>
        <button onclick="window.swipe('pass')">Pass ❌</button>
        <button onclick="window.swipe('like')">Like ❤️</button>
    </div>

    <script>
        let profiles = [];
        let currentIndex = 0;
        let currentUser = { uid: 'testUser123' };

        function renderProfile() {
            if (profiles.length === 0 || currentIndex >= profiles.length) {
                document.getElementById('card-box').innerHTML = '<h2>No more profiles nearby</h2>';
                return;
            }
            const profile = profiles[currentIndex];
            document.getElementById('profile-img').src = profile.image;
            document.getElementById('profile-name').innerText = `${profile.name}, ${profile.age}`;
            document.getElementById('profile-bio').innerText = profile.bio;
        }

        window.swipe = async (action) => {
            currentIndex++;
            renderProfile();
        };

        // Mock profiles for testing
        const mockProfiles = [
            { uid: 'mock1', name: 'Jessica', age: 24, bio: 'Coffee lover and explorer ☕', image: 'https://picsum.photos/300/400?random=1' },
            { uid: 'mock2', name: 'David', age: 27, bio: 'Musician and dog dad 🎸', image: 'https://picsum.photos/300/400?random=2' }
        ];
        profiles = profiles.concat(mockProfiles);
        renderProfile();
    </script>
</body>
</html>
