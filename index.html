<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Dating App</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card-container {
      background: #1e293b;
      width: 320px;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }
    input, textarea {
      width: 90%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      font-family: inherit;
    }
    button {
      width: 98%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 8px;
      border: none;
      background: #f43f5e;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-secondary {
      background: transparent;
      border: 1px solid #334155;
      color: #94a3b8;
    }
    .profile-img {
      width: 100%;
      height: 380px;
      object-fit: cover;
      border-radius: 16px;
    }
    .actions {
      display: flex;
      gap: 20px;
      margin-top: 15px;
    }
    .action-btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      font-size: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .btn-pass { background: #334155; color: #f43f5e; }
    .btn-like { background: #f43f5e; color: #fff; }
  </style>
</head>
<body>

  <!-- 1. Auth Screen -->
  <div id="auth-box" class="card-container">
    <h2 style="color: #f43f5e;">Find Your Match</h2>
    <input type="email" id="email" placeholder="Email Address">
    <input type="password" id="password" placeholder="Password">
    <button onclick="handleSignUp()">Sign Up</button>
    <button class="btn-secondary" onclick="handleLogIn()">Log In</button>
  </div>

  <!-- 2. Profile Creation Screen -->
  <div id="profile-setup-box" class="card-container" style="display: none;">
    <h2 style="color: #f43f5e;">Create Profile</h2>
    <input type="text" id="user-name" placeholder="Your Name">
    <input type="number" id="user-age" placeholder="Your Age">
    <textarea id="user-bio" placeholder="Short Bio..."></textarea>
    <input type="text" id="user-photo" placeholder="Photo URL Link">
    <button onclick="saveUserProfile()">Save & Start Swiping</button>
  </div>

  <!-- 3. Swiping Screen -->
  <div id="card-box" class="card-container" style="display: none;">
    <img id="profile-img" class="profile-img" src="" alt="Profile">
    <h2 id="profile-name" style="margin: 15px 0 5px 0;"></h2>
    <p id="profile-bio" style="color: #94a3b8; margin: 0 0 15px 0; text-align: center;"></p>
    <div class="actions">
      <button class="action-btn btn-pass" onclick="swipe('pass')">✕</button>
      <button class="action-btn btn-like" onclick="swipe('like')">❤️</button>
    </div>
  </div>

  <!-- Firebase Scripts -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, collection, getDocs, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC3ZAzNTicM0R8lIZzyUzZBwkYQAXGMtr8",
      authDomain: "mydatingapp-d4816.firebaseapp.com",
      projectId: "mydatingapp-d4816",
      storageBucket: "mydatingapp-d4816.firebasestorage.app",
      messagingSenderId: "927487150193",
      appId: "1:927487150193:web:ba4f171a1adb5be92433d0"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let profiles = [];
    let currentIndex = 0;

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        document.getElementById('auth-box').style.display = 'none';
        
        // Check if user already created a profile
        const userDoc = await getDoc(doc(db, "users", user.uid));
        if (userDoc.exists()) {
          loadRealProfiles();
        } else {
          document.getElementById('profile-setup-box').style.display = 'flex';
        }
      } else {
        document.getElementById('auth-box').style.display = 'flex';
        document.getElementById('profile-setup-box').style.display = 'none';
        document.getElementById('card-box').style.display = 'none';
      }
    });

    window.handleSignUp = () => {
      const email = document.getElementById('email').value;
      const pass = document.getElementById('password').value;
      createUserWithEmailAndPassword(auth, email, pass).catch(e => alert(e.message));
    };

    window.handleLogIn = () => {
      const email = document.getElementById('email').value;
      const pass = document.getElementById('password').value;
      signInWithEmailAndPassword(auth, email, pass).catch(e => alert(e.message));
    };

    window.saveUserProfile = async () => {
      const name = document.getElementById('user-name').value;
      const age = document.getElementById('user-age').value;
      const bio = document.getElementById('user-bio').value;
      const photo = document.getElementById('user-photo').value || "https://images.unsplash.com/photo-1494790108377-be9c29b29330";

      if (!name || !age) {
        alert("Please enter your name and age.");
        return;
      }

      await setDoc(doc(db, "users", currentUser.uid), {
        uid: currentUser.uid,
        name: name,
        age: age,
        bio: bio,
        image: photo
      });

      document.getElementById('profile-setup-box').style.display = 'none';
      loadRealProfiles();
    };

    async function loadRealProfiles() {
      const querySnapshot = await getDocs(collection(db, "users"));
      profiles = [];
      querySnapshot.forEach((doc) => {
        if (doc.id !== currentUser.uid) {
          profiles.push(doc.data());
        }
      });

      document.getElementById('card-box').style.display = 'flex';
      renderProfile();
    }

    function renderProfile() {
      if (profiles.length === 0 || currentIndex >= profiles.length) {
        document.getElementById('card-box').innerHTML = '<h2>No more real profiles nearby!</h2>';
        return;
      }
      const profile = profiles[currentIndex];
      document.getElementById('profile-img').src = profile.image;
      document.getElementById('profile-name').innerText = `${profile.name}, ${profile.age}`;
      document.getElementById('profile-bio').innerText = profile.bio;
    }

    window.swipe = async (action) => {
      if (action === 'like' && currentUser && profiles[currentIndex]) {
        const profile = profiles[currentIndex];
        await addDoc(collection(db, "matches"), {
          likerId: currentUser.uid,
          likedUserId: profile.uid,
          timestamp: serverTimestamp()
        });
      }
      currentIndex++;)
      
      renderProfile();
    };
  // Mock profiles for testing
const mockProfiles = [
  { uid: 'mock1', name: 'Jessica', age: 24, bio: 'Coffee lover and explorer ☕', image: 'https://picsum.photos/300/400?random=1' },
  { uid: 'mock2', name: 'David', age: 27, bio: 'Musician and dog dad 🎸', image: 'https://picsum.photos/300/400?random=2' }
];
profiles = (typeof profiles !== 'undefined' ? profiles : []).concat(mockProfiles);
renderProfile();
</body>
</html>
